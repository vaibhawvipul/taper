[package]
name = "taper"
version = "0.2.0"
edition = "2024"
authors = ["Vipul Vaibhaw <vaibhaw.vipul@gmail.com>"]
build = "build.rs"
description = "A lightweight neural network library with tape-based automatic differentiation, where every backward pass is verified against finite differences."
license = "MIT"
repository = "https://github.com/vaibhawvipul/taper"
documentation = "https://docs.rs/taper"
readme = "README.md"
keywords = ["deep-learning", "autodiff", "neural-network", "machine-learning", "tensor"]
categories = ["science", "algorithms"]
# The MNIST download cache and benchmark scripts are not part of the library.
# Patterns are anchored with a leading slash: a bare "data/" would also match
# src/data/, which silently produced a package that would not compile.
exclude = ["/data/", "/test_data/", "/*.py"]

[dependencies]
smallvec = "1.15.1"
rand = "0.8.5"
rand_distr = "0.4.3"
mimalloc = { version = "0.1.48", default-features = false }
flate2 = "1.1.2"
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
indicatif = "0.17"
matrixmultiply = "0.3"
cblas-sys = { version = "0.1", optional = true }
blas-src   = { version = "0.10", default-features = false, optional = true } # vendor chosen by features below
# Only pulled in by `blas-openblas-system`, to flip openblas-src onto the
# already-installed library instead of compiling OpenBLAS from source.
openblas-src = { version = "0.10", default-features = false, features = ["system"], optional = true }
rayon = { version = "1.10" }
lazy_static = "1.4"
# Already in the tree via reqwest; used for the safetensors JSON header.
serde_json = "1"

[features]
# Default: pure-Rust GEMM (matrixmultiply)
default = []

# Enable BLAS via CBLAS API and select a vendor:
blas = ["cblas-sys", "blas-src"]                # turn on CBLAS
blas-openblas = ["blas", "blas-src/openblas"]   # build OpenBLAS from source, then link it
# Link an OpenBLAS already on the system (apt: libopenblas-dev). Building from
# source needs a Fortran toolchain, takes minutes, and emits a shared object
# that then has to be found via LD_LIBRARY_PATH.
blas-openblas-system = ["blas-openblas", "dep:openblas-src"]
blas-accelerate = ["blas", "blas-src/accelerate"] # macOS Accelerate

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
approx = "0.5"
