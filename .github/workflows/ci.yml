name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The SIMD kernels are #[cfg]-gated per architecture and per target-feature,
  # so a single runner only ever compiles one of them. Each entry below is the
  # only place its kernel gets type-checked and linted at all.
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 (sse)
            os: ubuntu-latest
            flags: ""
          - name: x86_64 (avx+fma)
            os: ubuntu-latest
            flags: "-C target-feature=+avx,+fma"
          - name: aarch64 (neon)
            os: macos-latest
            flags: ""
    env:
      # Setting RUSTFLAGS replaces `.cargo/config.toml`'s `[build] rustflags`,
      # which is what we want: `-C target-cpu=native` is right for local
      # benchmarking but bakes host-specific instructions into CI artifacts.
      RUSTFLAGS: "-D warnings ${{ matrix.flags }}"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

  # The `blas` feature swaps in a whole different gemm implementation, so it
  # needs its own build. Both vendors are covered because the failure mode is
  # in linkage, which differs per vendor, not in our code.
  blas:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: blas (accelerate)
            os: macos-latest
            feature: blas-accelerate
            setup: ""
          - name: blas (openblas)
            os: ubuntu-latest
            feature: blas-openblas-system
            setup: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Install BLAS
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - name: Clippy
        run: cargo clippy --features ${{ matrix.feature }} --all-targets -- -D warnings
      - name: Test
        run: cargo test --features ${{ matrix.feature }} --all-targets
